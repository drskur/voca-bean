name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 기존 태그 (예: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          props = dict(
              line.strip().split('=', 1)
              for line in Path('version.properties').read_text().splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          )
          code = int(props['VERSION_CODE'])
          name = props['VERSION_NAME'].strip()
          if not 1 <= code <= 2_100_000_000:
              raise SystemExit('Invalid VERSION_CODE')
          if not re.fullmatch(r'\d+\.\d+\.\d+', name):
              raise SystemExit('VERSION_NAME must be a stable version: e.g. 1.0.0')
          if os.environ['TAG'] != f'v{name}':
              raise SystemExit('Tag must match VERSION_NAME in version.properties')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VERSION_CODE={code}\nVERSION_NAME={name}\n')
          PY

      - name: Test and build release APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required secret: $variable" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/app-release.apk \
            "$RUNNER_TEMP/app-aligned.apk"
          "$tools/apksigner" verify --verbose dist/app-release.apk

      - name: Generate update manifest
        run: |
          python3 scripts/update-manifest.py dist/app-release.apk \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --notes "VocaBean $VERSION_NAME — 변경 사항은 GitHub Release를 확인하세요." \
            > dist/update.json

      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Create as draft so the updater never sees a partially uploaded release.
          # Existing releases are intentionally not overwritten.
          gh release create "$TAG" dist/app-release.apk dist/update.json \
            --verify-tag --draft --title "VocaBean $VERSION_NAME" --generate-notes
          gh release edit "$TAG" --draft=false --latest
